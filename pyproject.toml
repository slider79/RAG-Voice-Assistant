[project]
name = "delphi-backend"
version = "1.0.0"
description = "Voice RAG backend (Vapi custom LLM) for Vercel."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
  "groq>=0.13",
  "google-genai>=0.3",
  "qdrant-client>=1.7",
  "pypdf>=4.0",
  "python-docx>=1.1",
]

# Vercel runs the FastAPI ASGI app defined as `app` in server.py.
[tool.vercel]
entrypoint = "server:app"
